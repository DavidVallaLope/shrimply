name: Flatpak prerelease

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-prerelease
  cancel-in-progress: true

env:
  CARGO_HOME: /usr/local/cargo
  CUDA_KEYRING_SHA256: d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba
  CUDA_SERIES: 12-9
  CUDA_VERSION: "12.9"
  FLATPAK_BUILD_DIR: target/flatpak-gtk/build
  FLATPAK_BUNDLE: dist/shrimply-gtk.flatpak
  FLATPAK_REPO_DIR: target/flatpak-gtk/repo
  FLATPAK_STATE_DIR: target/flatpak-gtk/state
  GNOME_RUNTIME_VERSION: "50"
  RUSTUP_HOME: /usr/local/rustup

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune --all --force
          df -h /

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates \
            clang \
            curl \
            flatpak \
            flatpak-builder \
            g++ \
            git \
            libclang-dev \
            librsvg2-common \
            make \
            pkg-config

          cuda_keyring="${RUNNER_TEMP}/cuda-keyring.deb"
          curl --fail --location --silent --show-error \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb" \
            --output "${cuda_keyring}"
          echo "${CUDA_KEYRING_SHA256}  ${cuda_keyring}" | sha256sum --check --strict
          sudo dpkg --install "${cuda_keyring}"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "cuda-nvcc-${CUDA_SERIES}"
          sudo apt-get clean

          sudo install -d -o "${USER}" -g "$(id -gn)" "${RUSTUP_HOME}" "${CARGO_HOME}"
          sudo install -d /usr/local/libclang-deps
          for library in \
            libbsd.so.0 \
            libedit.so.2 \
            libffi.so.8 \
            libicudata.so.74 \
            libicuuc.so.74 \
            liblzma.so.5 \
            libmd.so.0 \
            libtinfo.so.6 \
            libxml2.so.2 \
            libz.so.1 \
            libzstd.so.1
          do
            sudo ln -sf "/usr/lib/x86_64-linux-gnu/${library}" "/usr/local/libclang-deps/${library}"
          done

          test -x "/usr/local/cuda-${CUDA_VERSION}/bin/nvcc"
          test -f "/usr/local/cuda-${CUDA_VERSION}/include/cuda.h"
          test -f "/usr/local/cuda-${CUDA_VERSION}/lib64/stubs/libcuda.so"

      - name: Restore Rust toolchain
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /usr/local/cargo
            /usr/local/rustup
          key: rust-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install Rust toolchain
        run: |
          if [[ ! -x "${CARGO_HOME}/bin/rustup" ]]; then
            rustup_init="${RUNNER_TEMP}/rustup-init"
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              https://sh.rustup.rs \
              --output "${rustup_init}"
            chmod +x "${rustup_init}"
            "${rustup_init}" --yes --default-toolchain none --profile minimal
          fi
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
          "${CARGO_HOME}/bin/rustup" show

      - name: Save Rust toolchain
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /usr/local/cargo
            /usr/local/rustup
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Install GNOME SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes --noninteractive flathub \
            "org.gnome.Sdk//${GNOME_RUNTIME_VERSION}"

      - name: Resolve build cache key
        id: build-cache-key
        run: echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"

      - name: Restore Flatpak build cache
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.FLATPAK_STATE_DIR }}
          key: flatpak-state-ubuntu-24.04-${{ runner.arch }}-cuda-${{ env.CUDA_VERSION }}-${{ hashFiles('Cargo.lock', 'Makefile', 'rust-toolchain.toml', 'dev.shrimply.Shrimply.yml', 'packaging/flatpak/nvcc-g++') }}-${{ steps.build-cache-key.outputs.week }}
          restore-keys: |
            flatpak-state-ubuntu-24.04-${{ runner.arch }}-cuda-${{ env.CUDA_VERSION }}-${{ hashFiles('Cargo.lock', 'Makefile', 'rust-toolchain.toml', 'dev.shrimply.Shrimply.yml', 'packaging/flatpak/nvcc-g++') }}-
            flatpak-state-ubuntu-24.04-${{ runner.arch }}-cuda-${{ env.CUDA_VERSION }}-

      - name: Create Flatpak source archive
        id: source
        shell: bash
        run: |
          source_archive="${RUNNER_TEMP}/shrimply-source.tar"
          git ls-files --recurse-submodules -z \
            | tar \
              --exclude-from=.dockerignore \
              --group=0 \
              --no-recursion \
              --null \
              --numeric-owner \
              --owner=0 \
              -cf "${source_archive}" \
              -T -
          source_hash="$(sha256sum "${source_archive}" | cut -d ' ' -f 1)"
          hashed_archive="${RUNNER_TEMP}/shrimply-source-${source_hash}.tar"
          mv "${source_archive}" "${hashed_archive}"

          manifest="${RUNNER_TEMP}/dev.shrimply.Shrimply.yml"
          cp dev.shrimply.Shrimply.yml "${manifest}"
          grep -q '@SHRIMPLY_SOURCE@' "${manifest}"
          sed -i "s|@SHRIMPLY_SOURCE@|${hashed_archive}|" "${manifest}"
          if grep -q '@SHRIMPLY_SOURCE@' "${manifest}"; then
            echo "Flatpak source placeholder was not replaced" >&2
            exit 1
          fi
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - name: Build Flatpak
        run: |
          mkdir -p \
            "${FLATPAK_BUILD_DIR}" \
            "${FLATPAK_REPO_DIR}" \
            "${FLATPAK_STATE_DIR}" \
            "$(dirname "${FLATPAK_BUNDLE}")"
          git config --global --add safe.directory '*'
          flatpak-builder \
            --user \
            --ccache \
            --disable-rofiles-fuse \
            --force-clean \
            --state-dir="${FLATPAK_STATE_DIR}" \
            --repo="${FLATPAK_REPO_DIR}" \
            --install-deps-from=flathub \
            "${FLATPAK_BUILD_DIR}" \
            "${{ steps.source.outputs.manifest }}"
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "${FLATPAK_REPO_DIR}" \
            "${FLATPAK_BUNDLE}" \
            dev.shrimply.Shrimply
          df -h /

      - name: Verify Flatpak bundle
        run: |
          test -s "${FLATPAK_BUNDLE}"
          checksum="${FLATPAK_BUNDLE}.sha256"
          bundle_name="$(basename "${FLATPAK_BUNDLE}")"
          (
            cd "$(dirname "${FLATPAK_BUNDLE}")"
            sha256sum "${bundle_name}" > "${bundle_name}.sha256"
            sha256sum --check "${bundle_name}.sha256"
          )
          verify_repo="${RUNNER_TEMP}/flatpak-verify"
          ostree init --repo="${verify_repo}" --mode=archive-z2
          flatpak build-import-bundle "${verify_repo}" "${FLATPAK_BUNDLE}"
          test -s "${checksum}"

      - name: Save Flatpak build cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.FLATPAK_STATE_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          tag="flatpak-${GITHUB_SHA}"
          release_notes="${RUNNER_TEMP}/flatpak-release.md"
          {
            echo "Automated GTK Flatpak build of commit [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo '```console'
            echo 'flatpak install --user ./shrimply-gtk.flatpak'
            echo '```'
          } > "${release_notes}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            assets="$(gh release view "${tag}" --json assets --jq '.assets[].name')"
            grep -qx 'shrimply-gtk.flatpak' <<< "${assets}"
            grep -qx 'shrimply-gtk.flatpak.sha256' <<< "${assets}"
            echo "Release ${tag} already exists with both assets"
          else
            gh release create "${tag}" \
              "${FLATPAK_BUNDLE}#Shrimply GTK Flatpak" \
              "${FLATPAK_BUNDLE}.sha256#SHA-256 checksum" \
              --target "${GITHUB_SHA}" \
              --title "Shrimply Flatpak ${short_sha}" \
              --notes-file "${release_notes}" \
              --prerelease \
              --latest=false
          fi

          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("flatpak-"))) | .tagName' \
            | while IFS= read -r old_tag; do
                if [[ "${old_tag}" != "${tag}" ]]; then
                  gh release delete "${old_tag}" --cleanup-tag --yes
                fi
              done
