name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The build below runs a full Fedora + CUDA toolkit + GTK/Qt release
      # build inside Docker, which needs more disk than a stock runner has
      # free. Strip preinstalled toolchains we don't use to make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker image prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release bundle
        run: docker buildx build --target export --output type=local,dest=dist/stage .

      - name: Package tarball
        run: tar czf "Shrimply-${GITHUB_REF_NAME}.tar.gz" -C dist/stage usr

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Shrimply-${GITHUB_REF_NAME}.tar.gz" \
            --title "Shrimply ${GITHUB_REF_NAME}" \
            --generate-notes
