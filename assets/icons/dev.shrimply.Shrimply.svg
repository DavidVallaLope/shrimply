<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Shrimply — Adwaita</title>
  <desc>A curled orange-to-pink shrimp with a split tail, a raised face, and a continuous shaded sidewall.</desc>
  <defs>
    <path id="shrimp" d="M12 18H78C99 18 116 37 116 60C116 83 100 102 80 102C91 102 99 92 99 81C99 69 91 61 80 61H48C28 61 12 42 12 18Z M12 77L80 102H34C21 102 12 92 12 77Z M48 77H59C71 77 80 88 80 102Z"/>
    <linearGradient id="shell" gradientUnits="userSpaceOnUse" x1="22" y1="18" x2="91" y2="102">
      <stop stop-color="#f6a054"/>
      <stop offset=".48" stop-color="#fa745a"/>
      <stop offset="1" stop-color="#f8468d"/>
    </linearGradient>
    <linearGradient id="depth" gradientUnits="userSpaceOnUse" x1="12" y1="64" x2="116" y2="64">
      <stop stop-color="#c65e3b"/>
      <stop offset=".065" stop-color="#f49a65"/>
      <stop offset=".14" stop-color="#d97550"/>
      <stop offset=".25" stop-color="#bd4650"/>
      <stop offset=".7" stop-color="#bd355e"/>
      <stop offset=".86" stop-color="#d64276"/>
      <stop offset=".94" stop-color="#f77a9d"/>
      <stop offset="1" stop-color="#d74276"/>
    </linearGradient>
  </defs>
  <!-- Optical centering balances the heavier upper body. -->
  <g transform="translate(.5 4)">
  <!-- One solid sidewall with reflected light at its rounded edges. -->
  <g fill="url(#depth)">
    <use href="#shrimp" transform="translate(0 7)"/>
    <path d="M12 18C12 42 28 61 48 61H80C91 61 99 69 99 81V88C99 76 91 68 80 68H48C28 68 12 49 12 25Z M116 60C116 83 100 102 80 102V109C100 109 116 90 116 67Z M12 77C12 92 21 102 34 102H80V109H34C21 109 12 99 12 84Z M48 77L80 102V109L48 84Z"/>
  </g>
  <use href="#shrimp" fill="url(#shell)"/>
  <circle cx="33.5" cy="34" r="4.5" fill="#302527"/>
  </g>
</svg>
